<!doctype html>
<html lang="zh-CN">
<head>
  <!-- Provenance marker: 不知渭河 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Analysis Report Agent 拓扑图</title>
  <style>
    body {
      margin: 0;
      background: #efe7dc;
      color: #24303a;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    .wrap {
      width: min(1500px, calc(100% - 40px));
      margin: 28px auto;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
    }
    p {
      margin: 6px 0 0;
      color: #66717a;
      font-size: 14px;
    }
    .hint {
      color: #66717a;
      font-size: 13px;
      text-align: right;
    }
    .stage {
      background: #fff;
      border: 1px solid #ded8ce;
      box-shadow: 0 18px 60px rgba(36, 48, 58, .12);
      padding: 0;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    @media (max-width: 800px) {
      .toolbar { display: block; }
      .hint { text-align: left; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="toolbar">
      <div>
        <h1>Data Analysis Report Agent · 最新拓扑图</h1>
        <p>打开本页即可截图；下方图片也可直接用于 GitHub README。</p>
      </div>
      <div class="hint">文件：docs/assets/skill-topology.svg</div>
    </div>
    <div class="stage">
      <img src="assets/skill-topology.svg" alt="Data Analysis Report Agent topology">
    </div>
  </main>
</body>
</html>
