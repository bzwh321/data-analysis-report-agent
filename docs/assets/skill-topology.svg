<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Data Analysis Report Agent Topology</title>
  <desc id="desc">Clean horizontal topology for the data analysis report agent skill.</desc>
  <defs>
    <style>
      .page{fill:#f4f1ea}
      .canvas{fill:#fff;stroke:#ded8ce;stroke-width:2}
      .ink{fill:#26313a}
      .muted{fill:#65717b}
      .rule{stroke:#d8dfe4;stroke-width:2}
      .arrow{stroke:#8fa0aa;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .green-arrow{stroke:#007a53;stroke-width:4;fill:none;marker-end:url(#greenArrow)}
      .node{fill:#fff;stroke:#d7dfe4;stroke-width:2.5}
      .input{fill:#fff;stroke:#cfd8de}
      .blue{fill:#eef6fc;stroke:#126fa9}
      .green{fill:#eef8f2;stroke:#007a53}
      .warm{fill:#fff7eb;stroke:#bd8c32}
      .red{fill:#fff2f0;stroke:#b5473f}
      .gray{fill:#f6f8f9;stroke:#cfd8de}
      .title{font:700 44px Arial,"Microsoft YaHei",sans-serif;fill:#26313a}
      .subtitle{font:400 21px Arial,"Microsoft YaHei",sans-serif;fill:#65717b}
      .col{font:700 16px Arial,"Microsoft YaHei",sans-serif;fill:#007a53;letter-spacing:1.2px}
      .h{font:700 24px Arial,"Microsoft YaHei",sans-serif;fill:#26313a}
      .b{font:400 17px Arial,"Microsoft YaHei",sans-serif;fill:#4f5d66}
      .s{font:400 14px Arial,"Microsoft YaHei",sans-serif;fill:#65717b}
      .num{font:700 20px Arial,"Microsoft YaHei",sans-serif;fill:#007a53}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8fa0aa"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#007a53"/>
    </marker>
  </defs>

  <rect class="page" width="1800" height="1080"/>
  <rect class="canvas" x="48" y="40" width="1704" height="1000" rx="30"/>

  <text class="title" x="92" y="112">Data Analysis Report Agent · 最新拓扑图</text>
  <text class="subtitle" x="92" y="150">语义层、经验层、风格层和验证门禁分离，生成可审查的数据分析报告。</text>
  <text class="s" x="1390" y="116">Clean skill · No provider API · Local validators</text>

  <!-- Column headers -->
  <text class="col" x="110" y="225">INPUTS</text>
  <text class="col" x="425" y="225">KNOWLEDGE LAYERS</text>
  <text class="col" x="805" y="225">CORE WORKFLOW</text>
  <text class="col" x="1190" y="225">VALIDATION GATES</text>
  <text class="col" x="1490" y="225">OUTPUTS</text>

  <!-- Inputs -->
  <rect class="node input" x="95" y="255" width="260" height="100" rx="18"/>
  <text class="h" x="125" y="296">用户问题</text>
  <text class="b" x="125" y="326">目标 / 受众 / 格式</text>

  <rect class="node input" x="95" y="390" width="260" height="100" rx="18"/>
  <text class="h" x="125" y="431">数据源</text>
  <text class="b" x="125" y="461">文件 / 表格 / 查询结果</text>

  <rect class="node input" x="95" y="525" width="260" height="100" rx="18"/>
  <text class="h" x="125" y="566">可选选择</text>
  <text class="b" x="125" y="596">case-id / style-id</text>

  <!-- Knowledge layers -->
  <rect class="node blue" x="405" y="245" width="320" height="104" rx="18"/>
  <text class="h" x="435" y="286">experience/</text>
  <text class="b" x="435" y="316">通用报告经验</text>

  <rect class="node blue" x="405" y="380" width="320" height="116" rx="18"/>
  <text class="h" x="435" y="421">semantic_layer.yaml</text>
  <text class="b" x="435" y="451">字段含义 / 粒度 / 口径</text>
  <text class="b" x="435" y="477">分析边界</text>

  <rect class="node blue" x="405" y="530" width="320" height="116" rx="18"/>
  <text class="h" x="435" y="571">cases/*/experience/</text>
  <text class="b" x="435" y="601">案例阈值 / 优先级</text>
  <text class="b" x="435" y="627">好结论样例</text>

  <rect class="node warm" x="405" y="680" width="320" height="104" rx="18"/>
  <text class="h" x="435" y="721">styles/*/</text>
  <text class="b" x="435" y="751">配色 / 容器 / 页面风格</text>

  <!-- Core workflow -->
  <rect class="node green" x="780" y="300" width="310" height="330" rx="24"/>
  <text class="h" x="835" y="348">SKILL.md</text>
  <text class="b" x="835" y="378">稳定流程与报告契约</text>
  <line class="rule" x1="820" y1="408" x2="1050" y2="408"/>
  <text class="num" x="830" y="450">1</text><text class="b" x="865" y="450">识别 case 与 style</text>
  <text class="num" x="830" y="492">2</text><text class="b" x="865" y="492">生成分析计划</text>
  <text class="num" x="830" y="534">3</text><text class="b" x="865" y="534">读取并验证数据</text>
  <text class="num" x="830" y="576">4</text><text class="b" x="865" y="576">提炼证据结论</text>
  <text class="num" x="830" y="618">5</text><text class="b" x="865" y="618">生成报告</text>

  <!-- Validation -->
  <rect class="node red" x="1170" y="265" width="265" height="92" rx="18"/>
  <text class="h" x="1200" y="306">Plan Gate</text>
  <text class="b" x="1200" y="334">plan_validator.py</text>

  <rect class="node red" x="1170" y="410" width="265" height="92" rx="18"/>
  <text class="h" x="1200" y="451">Data Gate</text>
  <text class="b" x="1200" y="479">data_validator.py</text>

  <rect class="node red" x="1170" y="555" width="265" height="92" rx="18"/>
  <text class="h" x="1200" y="596">Output Gate</text>
  <text class="b" x="1200" y="624">output_validator.py</text>

  <!-- Outputs -->
  <rect class="node green" x="1480" y="285" width="230" height="118" rx="18"/>
  <text class="h" x="1510" y="328">报告产物</text>
  <text class="b" x="1510" y="358">HTML / Markdown / JSON</text>
  <text class="s" x="1510" y="384">答案优先 · 来源可追踪</text>

  <rect class="node gray" x="1480" y="450" width="230" height="118" rx="18"/>
  <text class="h" x="1510" y="493">图表与表格</text>
  <text class="b" x="1510" y="523">单位 / 标题 / 注释</text>
  <text class="s" x="1510" y="549">避免装饰性图形</text>

  <rect class="node gray" x="1480" y="615" width="230" height="118" rx="18"/>
  <text class="h" x="1510" y="658">维护资产</text>
  <text class="b" x="1510" y="688">case pack / style pack</text>
  <text class="s" x="1510" y="714">可复制、可审查</text>

  <!-- Arrows: no overlaps -->
  <path class="arrow" d="M355 305 H405"/>
  <path class="arrow" d="M355 440 H405"/>
  <path class="arrow" d="M355 575 H405"/>

  <path class="green-arrow" d="M725 297 H780"/>
  <path class="green-arrow" d="M725 438 H780"/>
  <path class="green-arrow" d="M725 588 H780"/>
  <path class="green-arrow" d="M725 732 C760 732 760 625 780 610"/>

  <path class="arrow" d="M1090 492 H1130 V311 H1170"/>
  <path class="arrow" d="M1090 534 H1130 V456 H1170"/>
  <path class="arrow" d="M1090 618 H1170"/>

  <path class="green-arrow" d="M1435 311 H1480"/>
  <path class="green-arrow" d="M1435 601 C1460 601 1460 344 1480 344"/>
  <path class="arrow" d="M1435 601 C1460 601 1460 509 1480 509"/>
  <path class="arrow" d="M1435 601 C1460 601 1460 674 1480 674"/>

  <!-- Separation rule -->
  <line class="rule" x1="92" y1="825" x2="1708" y2="825"/>

  <!-- Guardrails -->
  <rect class="node gray" x="95" y="860" width="760" height="105" rx="18"/>
  <text class="col" x="125" y="897">GUARDRAILS</text>
  <text class="b" x="125" y="930">不放 API Key / 不绑定模型供应商 / 不把案例字段塞进通用流程</text>
  <text class="b" x="125" y="956">数据范围、公式、普通备注放到报告末尾注释</text>

  <rect class="node gray" x="940" y="860" width="770" height="105" rx="18"/>
  <text class="col" x="970" y="897">MAINTENANCE RULE</text>
  <text class="b" x="970" y="930">语义层管字段含义；经验层管案例判断；风格层管页面设计</text>
  <text class="b" x="970" y="956">三层互不污染，换案例时只替换 case pack</text>
</svg>
