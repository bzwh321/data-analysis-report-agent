      accent: "#9F542F"
    contrast:
      primary_on_base: 10.58
      accent_on_base: 4.84
  navy-copper:
    display_name: 藏蓝铜橙
    character: 冷静、稳健、正式，适合经营复盘和董事会材料
    colors:
      base: "#EEF2F5"
      primary: "#223B57"
      accent: "#9E542E"
    contrast:
