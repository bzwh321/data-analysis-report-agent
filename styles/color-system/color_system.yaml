  plum-copper:
    display_name: 深梅紫铜
    character: 温暖、成熟、有质感，适合消费、品牌和人文类分析
    colors:
      base: "#F4EFEA"
      primary: "#4B3345"
      accent: "#995328"
    contrast:
      primary_on_base: 9.89
      accent_on_base: 5.07
  eastern-ink:
    display_name: 黛青朱砂
    character: 现代东方、沉静有力，适合中文专题和年度报告
    colors:
      base: "#F4F1E8"
      primary: "#1F4543"
      accent: "#A84335"
    contrast:
      primary_on_base: 9.34
      accent_on_base: 5.28
  deep-sea:
    display_name: 深海青绿
    character: 冷静、技术、连续性强，适合产品和运营数据报告
    colors:
      base: "#EDF3F3"
      primary: "#173B4D"
      accent: "#0F7B6C"
    contrast:
      primary_on_base: 10.58
      accent_on_base: 4.60
