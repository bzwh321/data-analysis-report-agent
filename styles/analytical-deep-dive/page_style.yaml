style_id: analytical-deep-dive
display_name: 数据分析深潜报告
design_intent: 用咨询行业 Exhibit report 的结构呈现可复核分析：一句话结论、方法边界、证据图表和来源注释。
reference_pattern:
  inspiration:
    - McKinsey/MGI executive-summary exhibits
    - BCG research-report exhibit pages
  visual_principle: 少颜色、强结论、图表先服务判断，不做装饰。
page:
  format: consulting_research_exhibit_report
  max_width: 1180px
  density: medium_high
  background: "#FFFFFF"
  content_background: "#FFFFFF"
palette:
  primary: "#27323A"
  secondary: "#007A53"
  accent: "#005F9E"
  warm_neutral: "#EFE7DC"
  evidence: "#D8EADB"
  warning: "#9A5B22"
  neutral_700: "#4E5961"
  neutral_500: "#7B858C"
  neutral_200: "#D9DEE2"
  neutral_100: "#F5F3EF"
typography:
  font_family: "Arial, Helvetica, Microsoft YaHei, sans-serif"
  h1: {size: 30, weight: 500, line_height: 1.22}
  h2: {size: 24, weight: 500, line_height: 1.28}
  h3: {size: 16, weight: 700, line_height: 1.35}
  body: {size: 15, weight: 400, line_height: 1.68}
  caption: {size: 11, weight: 400, line_height: 1.45}
layout:
  header: publication_header_with_research_question
  first_screen:
    - one_sentence_answer
    - exhibit_1_takeaway_chart
  body_grid: narrative_column_plus_exhibit_column
  sections:
    - question_and_boundary
    - exhibit_takeaway
    - decomposition
    - counter_evidence
    - implications
    - limitations
    - end_notes
components:
  exhibit:
    label_format: "图表 1"
    title_style: full_sentence_takeaway
    source_placement: end_notes_unless_decision_critical
    note_placement: end_notes_unless_decision_critical
  evidence_box:
    background: "#F5F3EF"
    border_left: secondary
  method_strip:
    style: end_notes_table
  end_notes:
    title: 口径与注释
    includes: [data_range, metric_definitions, sources, chart_notes, non_decision_caveats]
charts:
  preferred: [takeaway_bar, small_multiple_line, decomposition_bar, annotated_table, waterfall]
  chart_background: "#F7F5F1"
  grid_lines: minimal
  label_style: direct_labels
  color_rule: one_primary_color_plus_one_exception_color
tables:
  style: thin_rules_publication_table
  show_units: true
  show_source: end_notes
do:
  - Start every exhibit title with the finding, not the chart type.
  - Keep the opening page focused on conclusion, evidence, and next action.
  - Put data range, metric definitions, sources, and ordinary notes in the end notes section.
  - Use one primary accent color and one exception color per page.
  - Keep only decision-critical evidence boundaries next to the finding.
  - Use report-native labels in the report language; avoid generic English template labels in Chinese reports.
avoid:
  - Front-loading data scope or source notes before the analytical conclusion.
  - Generic dashboard cards, glassmorphism, gradients, decorative badges, or purple emphasis.
  - More than three meaningful colors in one view.
  - Equal-width three-card summaries as the default ending.
  - Full value labels on charts with more than six marks.
  - Causal language without evidence or explicit confidence.
  - Charts without units, axis baselines, direct labels, or source references in the end notes.
