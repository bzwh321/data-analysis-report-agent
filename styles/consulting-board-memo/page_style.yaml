style_id: consulting-board-memo
display_name: 咨询式董事会备忘录
design_intent: 用出版物式董事会备忘录结构呈现推荐、备选方案、取舍和风险，避免仪表盘化。
reference_pattern:
  inspiration:
    - Bain brief publication layout
    - BCG executive perspective recommendation pages
  visual_principle: 先推荐，再论证；少组件，多文字节奏和矩阵证据。
page:
  format: board_memo_publication
  max_width: 1040px
  density: medium
  background: "#FFFFFF"
  content_background: "#FFFFFF"
palette:
  primary: "#222222"
  secondary: "#D71920"
  accent: "#0E6F66"
  warm_neutral: "#F4F0EA"
  risk: "#8A3A24"
  neutral_700: "#4F4F4F"
  neutral_500: "#767676"
  neutral_200: "#D7D7D7"
typography:
  font_family: "Georgia, 'Times New Roman', SimSun, Microsoft YaHei, serif"
  sans_family: "Arial, Helvetica, Microsoft YaHei, sans-serif"
  h1: {size: 32, weight: 400, line_height: 1.2}
  h2: {size: 24, weight: 400, line_height: 1.28}
  body: {size: 16, weight: 400, line_height: 1.72}
  caption: {size: 11, weight: 400, line_height: 1.45}
layout:
  header: memo_letterhead_with_context
  first_screen:
    - decision_question
    - recommendation_box
    - situation_complication
  body_grid: prose_with_wide_exhibit
  sections:
    - recommendation
    - situation
    - complication
    - option_matrix
    - risk_mitigation
    - evidence_appendix
components:
  recommendation_box:
    border_left: secondary
    background: "#F4F0EA"
    includes: [decision, why_now, conditions]
  option_matrix:
    columns: [option, upside, tradeoff, evidence, decision]
    highlight_recommended: true
  risk_note:
    style: small_serif_note_with_rule
charts:
  preferred: [option_matrix, scenario_bar, driver_tree, decision_table]
  chart_background: "#FFFFFF"
  annotation_style: figure_label
tables:
  style: publication_matrix_with_thin_rules
  row_height: comfortable
do:
  - Put the recommended option before the detailed evidence.
  - Make tradeoffs and assumptions explicit next to the recommendation.
  - Use red only as Bain-like identity/accent, not as generic danger.
avoid:
  - KPI tile grids, status dashboards, glass cards, or decorative gradients.
  - Hiding risks in an appendix.
  - More than one highlighted recommendation.
